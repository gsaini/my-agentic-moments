[project]
name = "my-agentic-moments"
version = "0.1.0"
description = "A journal of small agentic experiments: build it, measure it, write down what happened."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gopal Saini" }]
dependencies = [
    "anthropic>=1.11",
    "pydantic>=2.7",
    "pytest>=8", # the moments run model-written code against tests
    "typesafe-sdk>=0.7.5", # moment 02: Jev (0.7.5 adds the `compression` option)
]

[project.scripts]
critique-graph = "critique_graph.cli:main"
jev-cascade = "jev_cascade.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic", "moments/01-critique-graph/critique_graph", "moments/02-jev-cascade/jev_cascade"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["moments/*/tasks", "moments/*/tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentic", "critique_graph", "jev_cascade"]

[tool.pytest.ini_options]
testpaths = ["tests", "moments"]
norecursedirs = ["tasks", "reference", "runs"]
